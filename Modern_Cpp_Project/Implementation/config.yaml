# ===================================================================
# Client Configuration File
# ===================================================================

# Host server connection settings (receives threshold, sends LED state and temp)
host_server:
  tcp:
    ip: "192.168.1.18"   # Host server IP for TCP
    port: 8080           # Host server TCP port
  udp:
    ip: "192.168.1.18"   # Host server IP for UDP
    port: 8081           # Host server UDP port

# Sensor/Actuator server connection settings (TCP only for request-response)
sensor_actuator_server:
  tcp:
    ip: "192.168.1.18"   # Sensor/Actuator server IP for TCP
    port: 9080           # Sensor/Actuator server TCP port

# Logging configuration
logging:
  level: "info"  # Options: none, error, info, debug, trace

# Application settings
application:
  initial_threshold: 25.0  # Initial temperature threshold in Celsius
  check_interval: 100      # Milliseconds between checks
